name: Deploy Little Lanterns to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import and validate the 54 core Sahifa supplications
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          node scripts/import-sahifa.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check sahifa-content.js
          node --check sahifa-experience.js
          node --check scripts/import-sahifa.mjs
          node --check reading-enhancements.js
          node --check reader-layout.js
          node --check flags.js
          node --check flags-data.js
          node --check scripts/vendor-flags.mjs
  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check reading-enhancements.js
          node --check reader-layout.js
          node --check flags.js
          node --check flags-data.js
          node --check scripts/vendor-flags.mjs
      - name: Download and vendor flag SVGs
        run: node scripts/vendor-flags.mjs
      - name: Commit local flag assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flags data/sahifa/core.json sahifa-content.js
          if ! git diff --cached --quiet; then
            git commit -m "Vendor local flag SVG assets"
            git push
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4